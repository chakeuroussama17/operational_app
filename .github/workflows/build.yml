name: Build Android APK

# Builds a release-signed (debug key) APK on every push to main, and on
# demand from the Actions tab. The finished APK is uploaded as a downloadable
# artifact — grab it from the run's "Artifacts" section to sideload and test.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hicom-ops-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
