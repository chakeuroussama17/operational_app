<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HICOM — Operational Dashboard</title>
  <meta name="description" content="Live production dashboard for Casting, Secondary and Machining, read straight from the plant spreadsheet." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand-mark"><img src="pictures/logo.png" alt="HICOM" /></div>
      <div>
        <div class="brand-name">Operational Dashboard</div>
        <div class="brand-sub" id="dataSource">loading…</div>
      </div>

      <nav class="tabs" role="tablist" aria-label="Production area" id="moduleTabs">
        <button class="tab" role="tab" data-module="casting"   aria-selected="true">Casting</button>
        <button class="tab" role="tab" data-module="secondary" aria-selected="false">Secondary</button>
        <button class="tab" role="tab" data-module="machining" aria-selected="false">Machining</button>
        <button class="tab" role="tab" data-module="tables"    aria-selected="false">Tables</button>
      </nav>

      <div class="appbar-spacer"></div>

      <button class="icon-btn" id="refreshBtn" title="Reload from the sheet" aria-label="Reload">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Light / dark" aria-label="Toggle theme">
        <svg id="themeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="filters" id="analysisFilters">
    <span class="filter-label">Shift</span>
    <div class="seg" id="shiftSeg" role="group" aria-label="Shift">
      <button data-shift="all"   aria-pressed="true">Both</button>
      <button data-shift="Day"   aria-pressed="false">Day</button>
      <button data-shift="Night" aria-pressed="false">Night</button>
    </div>

    <span class="filter-label" style="margin-left:8px">Range</span>
    <div class="seg" id="rangeSeg" role="group" aria-label="Date range">
      <button data-days="7"  aria-pressed="false">7D</button>
      <button data-days="14" aria-pressed="false">14D</button>
      <button data-days="30" aria-pressed="true">30D</button>
      <button data-days="90" aria-pressed="false">90D</button>
    </div>

    <span class="filter-label" style="margin-left:8px" id="opFilterLabel" hidden>Operation</span>
    <div class="seg" id="opSeg" role="group" aria-label="Operation" hidden></div>

    <span class="filter-label" style="margin-left:8px" id="groupFilterLabel">Machine</span>
    <div class="chip-scroll" id="groupChips"></div>
  </div>

  <div class="filters" id="tableFilters" hidden>
    <span class="filter-label">Sheet tab</span>
    <div class="chip-scroll" id="tableChips"></div>
    <input class="search" id="tableSearch" type="search"
           placeholder="Filter rows…" aria-label="Filter rows" />
  </div>

  <div class="banner" id="banner" hidden>
    <div class="banner-inner" id="bannerInner"></div>
  </div>

  <main id="view"></main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
